<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post-Meeting Reflection — Upbuild</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header></header>

      <h1 id="page-title">Post-Meeting Reflection</h1>
      <p class="text-gray">Reflect on your coaching session following the mentoring meeting.</p>
    </div>

    <div id="banner-area"></div>

    <div id="content" style="display:none">
      <div class="card" id="reflection-questions"></div>

      </div>
      <div id="submit-success" class="alert alert-success mt-16" style="display:none"></div>
    </div>
  </main>
  <script src="/js/api.js?v=2"></script>
  <script src="/js/post-reflection.js?v=1"></script>
